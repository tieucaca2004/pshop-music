[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Publish surface (SECURITY) ─────────────────────────────────────────
# Site tĩnh đang publish = "." (toàn bộ thư mục gốc). Các thư mục/file dưới đây
# KHÔNG phải asset site (dữ liệu nội bộ, backup, secret n8n, tài liệu, mã
# Cloud Functions, scripts...) — ép trả 404 kể cả khi file có trong bản deploy.
# force = true bắt buộc: không có nó Netlify vẫn serve file tồn tại.
# Danh sách được kiểm tra tự động bởi tests/publish-surface.test.js.


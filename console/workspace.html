<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Workspace - PSH Console</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:#1d1d1f;min-height:100vh;display:flex;overflow:hidden}
.ws-sidebar{width:260px;min-height:100vh;background:#fff;border-right:1px solid #e5e5ea;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.ws-sidebar.collapsed{width:64px}
.ws-brand{padding:1rem 1.25rem;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:0.75rem}
.ws-logo{width:32px;height:32px;background:linear-gradient(135deg,#4F46E5,#10B981);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.9rem}
.ws-nav{flex:1;padding:0.75rem;overflow-y:auto}
.ws-nav-cat{font-size:0.7rem;font-weight:600;color:#86868b;text-transform:uppercase;padding:0.75rem 0.75rem 0.35rem;letter-spacing:0.05em}
.ws-nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.75rem;border-radius:8px;color:#515154;font-size:0.9rem;text-decoration:none;transition:all .15s;margin-bottom:2px}
.ws-nav-item:hover{background:#f5f5f7;color:#1d1d1f}.ws-nav-item.active{background:#e8e8ff;color:#4F46E5;font-weight:500}
.ws-sidebar.collapsed .ws-brand-text,.ws-sidebar.collapsed .ws-nav-item span,.ws-sidebar.collapsed .ws-nav-cat{display:none}
.ws-sidebar.collapsed .ws-nav-item{justify-content:center;padding:0.6rem}
.ws-sidebar.collapsed .ws-logo{margin:0 auto}
.ws-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ws-header{background:#fff;border-bottom:1px solid #e5e5ea;padding:0.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0}
.ws-header-left{display:flex;align-items:center;gap:0.75rem}
.ws-search{flex:1;max-width:320px;padding:0.45rem 0.7rem;border:1px solid #d1d1d6;border-radius:6px;font-size:0.85rem;color:#86868b;background:#f5f5f7}
.ws-search:focus{outline:none;background:#fff;border-color:#4F46E5}
.ws-biz-name{font-weight:600;font-size:0.9rem;cursor:pointer;padding:0.3rem 0.5rem;border-radius:4px;transition:background .15s}
.ws-biz-name:hover{background:#f5f5f7}
.ws-biz-dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #e5e5ea;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);min-width:200px;z-index:100;padding:0.25rem}
.ws-biz-dropdown.show{display:block}
.ws-biz-option{padding:0.6rem 0.75rem;cursor:pointer;font-size:0.85rem;transition:background .15s}
.ws-biz-option:hover{background:#f5f5f7}
.ws-header-right{display:flex;align-items:center;gap:0.75rem}
.ws-notif{width:32px;height:32px;border-radius:50%;background:#f5f5f7;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;position:relative}
.ws-notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#EF4444;border-radius:50%}
.ws-user{font-size:0.85rem;color:#86868b;display:flex;align-items:center;gap:0.5rem}
.ws-content{flex:1;padding:1.5rem;overflow-y:auto;background:#f5f5f7}
.ws-breadcrumb{font-size:0.8rem;color:#86868b;margin-bottom:1rem}
.ws-breadcrumb a{color:#86868b;text-decoration:none}.ws-breadcrumb a:hover{color:#4F46E5}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.ws-card{background:#fff;border-radius:10px;padding:1.25rem;border:1px solid #e5e5ea;transition:box-shadow .2s}
.ws-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ws-card-icon{font-size:1.5rem;margin-bottom:0.5rem}
.ws-card-num{font-size:1.75rem;font-weight:700;color:#1d1d1f}
.ws-card-label{font-size:0.8rem;color:#86868b;margin-top:0.2rem}
.ws-panel{background:#fff;border-radius:10px;padding:1.5rem;border:1px solid #e5e5ea;margin-bottom:1rem}
.ws-panel h3{font-weight:600;font-size:1rem;margin-bottom:0.75rem}
.ws-empty{padding:3rem;text-align:center;color:#86868b;font-size:0.9rem}
.ws-footer{text-align:center;padding:0.75rem;font-size:0.75rem;color:#c7c7cc;border-top:1px solid #e5e5ea;background:#fff;flex-shrink:0}
@media(max-width:768px){.ws-sidebar{width:64px}.ws-sidebar .ws-brand-text,.ws-sidebar .ws-nav-item span,.ws-sidebar .ws-nav-cat{display:none}.ws-nav-item{justify-content:center;padding:0.6rem}.ws-sidebar .ws-logo{margin:0 auto}.ws-search{max-width:120px}.ws-header{padding:0.4rem 0.75rem}}
</style></head><body>
<aside class="ws-sidebar" id="wsSidebar"><div class="ws-brand"><div class="ws-logo">C</div><span class="ws-brand-text">PSH Console</span></div><nav class="ws-nav" id="wsNav"></nav></aside>
<main class="ws-main">
<header class="ws-header">
<div class="ws-header-left">
<div style="cursor:pointer;font-size:1.2rem;padding:0.2rem" onclick="document.getElementById('wsSidebar').classList.toggle('collapsed')">☰</div>
<div style="position:relative"><span class="ws-biz-name" id="currentBiz">Loading...</span><div class="ws-biz-dropdown" id="bizDropdown"></div></div>
</div>
<input class="ws-search" placeholder="Search..." id="wsSearch" onkeyup="if(event.key==='Enter')alert('Search coming soon')">
<div class="ws-header-right">
<div class="ws-notif" title="Notifications"><span>🔔</span><span class="ws-notif-dot"></span></div>
<div class="ws-user"><span id="userEmail"></span><button style="background:none;border:1px solid #d1d1d6;border-radius:6px;padding:0.3rem 0.6rem;cursor:pointer;font-size:0.8rem" onclick="firebase.auth().signOut();window.location='/console/business-selector.html'">Sign Out</button></div>
</div></header>
<div class="ws-content" id="wsContent"><div class="ws-empty">Loading...</div></div>
<footer class="ws-footer">PSH Console &mdash; Business Operating Platform v1.0</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/js/firebase-config.js?v=27ee045"></script>
<script src="/js/workspace-engine.js?v=27ee045"></script>
<script>
(function(){
var bid=window.location.pathname.split('/')[2];if(!bid)bid=localStorage.getItem('psh_last_biz');if(!bid){window.location='/console/business-selector.html';return;}
localStorage.setItem('psh_last_biz',bid);
var currentPage=window.location.pathname.split('/')[3]||'dashboard';

firebase.auth().onAuthStateChanged(function(u){
if(!u){window.location='/console/business-selector.html';return;}
document.getElementById('userEmail').textContent=u.email||'';

// Load business info
firebase.database().ref('businesses/'+bid+'/info').once('value').then(function(s){
var i=s.val()||{};document.getElementById('currentBiz').textContent=i.displayName||bid;
});

// Business switcher
document.querySelector('.ws-biz-name').onclick=function(){
var dd=document.getElementById('bizDropdown');
if(dd.classList.contains('show')){dd.classList.remove('show');return;}
firebase.database().ref('businessMembers').once('value').then(function(s){
var all=s.val(),list=[],uid=u.uid;if(all)Object.keys(all).forEach(function(b){if(all[b]&&all[b][uid])list.push({businessId:b,role:all[b][uid].role})});
dd.innerHTML=list.map(function(b){return'<div class="ws-biz-option" onclick="window.location=\'/workspace/'+b.businessId+'\'">'+(b.businessId===bid?'✓ ':'')+b.businessId+' <span style="color:#86868b;font-size:0.75rem">('+b.role+')</span></div>'}).join('');dd.classList.add('show');
});};

// Dynamic sidebar from Module Registry
function renderSidebar(activeId){
var mods=WorkspaceEngine.getModules(bid);
var cats={};mods.forEach(function(m){if(!cats[m.category])cats[m.category]=[];cats[m.category].push(m);});
var html='';Object.keys(cats).forEach(function(cat){
html+='<div class="ws-nav-cat">'+cat+'</div>';
cats[cat].forEach(function(m){html+='<a class="ws-nav-item'+(m.id===activeId?' active':'')+'" href="/workspace/'+bid+'/'+m.id+'"><span>'+m.icon+'</span><span>'+m.name+'</span></a>';});
});
document.getElementById('wsNav').innerHTML=html;
}

renderSidebar(currentPage);

// Render page content
var pageView=document.getElementById('wsContent');
var pages={
dashboard:function(){
var productsCount=0;firebase.database().ref('products').once('value').then(function(s){productsCount=s.val()?Object.keys(s.val()).length:0;renderDashboard();});
firebase.database().ref('businessMembers/'+bid).once('value').then(function(s){var m=s.val()?Object.keys(s.val()).length:0;renderDashboard(m);});
var _m=0,_p=0;
function renderDashboard(memberCount){
if(memberCount)_m=memberCount;
pageView.innerHTML='<div class="ws-breadcrumb"><a href="/workspace/'+bid+'">Workspace</a> / Dashboard</div><div class="ws-grid" id="dg"></div><div class="ws-panel"><h3>Recent Activity</h3><p style="color:#86868b;font-size:0.9rem">No recent activity yet.</p></div><div class="ws-panel"><h3>System Health</h3><p style="color:#86868b;font-size:0.9rem">All systems operational. Firebase connected. Database online.</p></div>';
document.getElementById('dg').innerHTML=
'<div class="ws-card"><div class="ws-card-icon">🏢</div><div class="ws-card-num">'+(document.getElementById('currentBiz').textContent||bid)+'</div><div class="ws-card-label">Business</div></div>'+
'<div class="ws-card"><div class="ws-card-icon">👥</div><div class="ws-card-num">'+_m+'</div><div class="ws-card-label">Members</div></div>'+
'<div class="ws-card"><div class="ws-card-icon">📊</div><div class="ws-card-num">'+(Object.keys(WorkspaceEngine.getModules(bid)).length||9)+'</div><div class="ws-card-label">Modules Available</div></div>'+
'<div class="ws-card"><div class="ws-card-icon">✔️</div><div class="ws-card-num">Active</div><div class="ws-card-label">Workspace Status</div></div>';
}
renderDashboard();
},
products:function(){pageView.innerHTML=pageHtml('Products','📦','Product management coming soon.');},
orders:function(){pageView.innerHTML=pageHtml('Orders','📋','Order management coming soon.');},
customers:function(){pageView.innerHTML=pageHtml('Customers','👥','Customer management coming soon.');},
cms:function(){pageView.innerHTML=pageHtml('CMS','📝','Content management coming soon.');},
media:function(){pageView.innerHTML=pageHtml('Media','🖼️','Media library coming soon.');},
ai:function(){pageView.innerHTML=pageHtml('AI Workspace','🤖','AI features coming soon.');},
team:function(){pageView.innerHTML=pageHtml('Team','👤','Team management coming soon.');},
settings:function(){pageView.innerHTML='<div class="ws-breadcrumb"><a href="/workspace/'+bid+'">Workspace</a> / Settings</div><div class="ws-panel"><h3>General</h3><p style="color:#86868b;font-size:0.9rem">Workspace settings will be available in an upcoming sprint.</p></div><div class="ws-panel"><h3>Profile</h3><p style="color:#86868b;font-size:0.9rem">User: '+u.email+'</p></div><div class="ws-panel"><h3>Appearance</h3><p style="color:#86868b;font-size:0.9rem">Theme customization coming soon.</p></div>';}
};
function pageHtml(name,icon,desc){return'<div class="ws-breadcrumb"><a href="/workspace/'+bid+'">Workspace</a> / '+name+'</div><div class="ws-panel"><div style="font-size:3rem;text-align:center;padding:2rem 0">'+icon+'</div><h3 style="text-align:center">'+name+'</h3><p style="text-align:center;color:#86868b;font-size:0.9rem">'+desc+'</p></div>';}
if(pages[currentPage])pages[currentPage]();else pageView.innerHTML='<div class="ws-empty" style="padding:4rem"><h2>404</h2><p>Page not found.</p><a href="/workspace/'+bid+'">Back to Dashboard</a></div>';
});
})();
</script></body></html>

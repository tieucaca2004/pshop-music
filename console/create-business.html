<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Business - PSH Console</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh}
.console-header{background:#fff;border-bottom:1px solid #e5e5ea;padding:1rem 2rem;display:flex;align-items:center;gap:0.75rem}
.console-logo{width:36px;height:36px;background:linear-gradient(135deg,#4F46E5,#10B981);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem}
.console-main{max-width:640px;margin:2rem auto;padding:0 1rem}
h1{font-size:1.5rem;font-weight:600;margin-bottom:0.25rem}
.sub{color:#86868b;margin-bottom:2rem}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-weight:500;margin-bottom:0.35rem;font-size:0.9rem}
.form-group input,.form-group select{width:100%;padding:0.65rem 0.75rem;border:1px solid #d1d1d6;border-radius:8px;font-size:0.95rem;font-family:inherit;background:#fff;transition:border .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-primary{width:100%;padding:0.75rem;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:#4338CA}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.error{color:#EF4444;font-size:0.85rem;margin-top:0.35rem;display:none}
.alert{padding:0.75rem 1rem;border-radius:8px;margin-bottom:1rem;display:none}
.alert.error{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;display:block}
.alert.success{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;display:block}
.loading{text-align:center;padding:3rem;color:#86868b}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
</style></head>
<body>
<header class="console-header"><div class="console-logo">C</div><span style="font-weight:600">PSH Console</span></header>
<main class="console-main">
<h1>Create Your Business</h1><p class="sub">Set up your business on PSH Console.</p>
<div id="alert" class="alert"></div>
<form id="createForm" style="display:none">
<div class="form-group"><label>Business Name <span style="color:#EF4444">*</span></label>
<input type="text" id="bizName" maxlength="120" placeholder="Your Business Name" required></div>
<div class="form-row">
<div class="form-group"><label>Business Type</label>
<select id="bizType"><option value="retail">Retail</option><option value="service">Service</option><option value="restaurant">Restaurant</option><option value="manufacturing">Manufacturing</option><option value="technology">Technology</option><option value="other">Other</option></select></div>
<div class="form-group"><label>Country</label>
<select id="bizCountry"><option value="VN">Vietnam</option><option value="US">United States</option><option value="SG">Singapore</option><option value="JP">Japan</option><option value="KR">South Korea</option></select></div></div>
<div class="form-row">
<div class="form-group"><label>Timezone</label>
<select id="bizTimezone"><option value="Asia/Ho_Chi_Minh">Asia/Ho_Chi_Minh (+07)</option><option value="Asia/Bangkok">Asia/Bangkok (+07)</option><option value="Asia/Singapore">Asia/Singapore (+08)</option><option value="Asia/Tokyo">Asia/Tokyo (+09)</option><option value="UTC">UTC (+00)</option></select></div>
<div class="form-group"><label>Currency</label>
<select id="bizCurrency"><option value="VND">VND (₫)</option><option value="USD">USD ($)</option><option value="SGD">SGD (S$)</option><option value="JPY">JPY (¥)</option></select></div></div>
<div class="form-row">
<div class="form-group"><label>Language</label>
<select id="bizLanguage"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="ja">日本語</option></select></div>
<div class="form-group"><label>Plan</label>
<select id="bizPlan"><option value="starter">Starter (Free)</option><option value="pro">Pro ($29/mo)</option><option value="enterprise">Enterprise ($99/mo)</option></select></div></div>
<button type="submit" class="btn-primary" id="submitBtn">Create Business</button>
</form>
<div id="loadingMsg" class="loading">&#9679;&#9679;&#9679; Loading...</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/js/firebase-config.js?v=e1820cb"></script>
<script>
(function(){
firebase.auth().onAuthStateChanged(function(u){
if(!u){window.location='/console/business-selector.html';return;}
document.getElementById('loadingMsg').style.display='none';
document.getElementById('createForm').style.display='block';
document.getElementById('submitBtn').addEventListener('click',function(e){
e.preventDefault();var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Creating...';
var name=document.getElementById('bizName').value.trim();if(!name){showError('Business Name is required.');btn.disabled=false;btn.textContent='Create Business';return;}
var bizId='biz-'+Date.now();var type=document.getElementById('bizType').value;
var data={businessId:bizId,displayName:name,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),ownerUid:u.uid,ownerEmail:u.email,ownerName:u.displayName||'',plan:document.getElementById('bizPlan').value,timezone:document.getElementById('bizTimezone').value,currency:document.getElementById('bizCurrency').value,country:document.getElementById('bizCountry').value,language:document.getElementById('bizLanguage').value,status:'active',createdAt:Date.now()};
var updates={};var bid=bizId;
updates['businesses/'+bid+'/info']={businessId:bid,displayName:data.displayName,slug:data.slug,status:'active',plan:data.plan,timezone:data.timezone,currency:data.currency,country:data.country,language:data.language,type:type,createdAt:Date.now(),updatedAt:Date.now()};
updates['businesses/'+bid+'/settings/general']={};
updates['businesses/'+bid+'/settings/branding']={};
updates['businesses/'+bid+'/subscription']={plan:data.plan,status:'active',createdAt:Date.now()};
updates['businessMembers/'+bid+'/'+u.uid]={role:'owner',email:u.email||'',name:u.displayName||u.email||'',assignedAt:Date.now(),status:'active'};
updates['registry/'+bid]={name:data.displayName,slug:data.slug,created:Date.now()};
firebase.database().ref().update(updates).then(function(){
localStorage.setItem('psh_last_biz',bid);
window.location='/workspace/'+bid;
}).catch(function(err){showError(err.message||'Failed to create business.');btn.disabled=false;btn.textContent='Create Business';});
});});function showError(m){var a=document.getElementById('alert');a.textContent=m;a.className='alert error';}
})();
</script></body></html>

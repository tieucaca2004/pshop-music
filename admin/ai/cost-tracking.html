<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Mức sử dụng AI và chi phí ƯỚC TÍNH theo Provider/Plugin, tổng hợp từ Nhật ký (<code>aiLogs</code>) đã có — chỉ đọc. Chi phí là ước tính tham khảo (đơn giá trung bình mỗi lượt Generate thành công), không phải Billing/thanh toán chính xác.</p>
      <div class="panel">
        <div class="form-group" style="max-width:280px">
          <label>Khoảng thời gian</label>
          <select id="costRangeFilter">
            <option value="today">Hôm nay</option>
            <option value="7d" selected>7 ngày gần nhất</option>
            <option value="30d">30 ngày gần nhất</option>
          </select>
        </div>
      </div>
      <div id="costResult" style="margin-top:1.5rem"></div>
    </div>
  </div>
</div>

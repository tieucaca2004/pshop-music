<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image AI - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Sinh ảnh marketing thật từ Sản phẩm/Khuyến mãi/Bài Blog/Prompt tự do — mọi ảnh luôn dừng lại ở <strong>Nháp</strong> để bạn xem trước, không có ảnh nào tự động dùng vào Sản phẩm/Blog/Banner cho tới khi bạn chủ động chọn.</p>

      <div class="panel" id="imgFormPanel">
        <h3>TẠO ẢNH MỚI</h3>
        <div class="field-grid">
          <div class="form-group">
            <label>LOẠI ẢNH</label>
            <select id="imgType">
              <option value="Product Hero Image">Product Hero Image</option>
              <option value="Facebook Post Image">Facebook Post Image</option>
              <option value="Facebook Carousel Image">Facebook Carousel Image</option>
              <option value="Banner Image">Banner Image</option>
              <option value="Promotion Banner">Promotion Banner</option>
              <option value="Blog Cover Image">Blog Cover Image</option>
              <option value="Blog Inline Image">Blog Inline Image</option>
            </select>
          </div>
          <div class="form-group">
            <label>KÍCH THƯỚC</label>
            <select id="imgSize">
              <option value="1:1">1:1 (vuông)</option>
              <option value="4:5">4:5 (dọc — xấp xỉ, Provider chỉ hỗ trợ 3 kích thước cố định)</option>
              <option value="16:9">16:9 (ngang)</option>
            </select>
          </div>
          <div class="form-group full">
            <label>SẢN PHẨM (chọn 1 trong 4 nguồn bên dưới)</label>
            <select id="imgProduct"><option value="">(không chọn)</option></select>
          </div>
          <div class="form-group full">
            <label>HOẶC KHUYẾN MÃI</label>
            <input type="text" id="imgPromotion" placeholder="VD: Giảm 15% dịp 30/4">
          </div>
          <div class="form-group full">
            <label>HOẶC BÀI BLOG</label>
            <select id="imgBlogPost"><option value="">(không chọn)</option></select>
          </div>
          <div class="form-group full">
            <label>HOẶC PROMPT TỰ DO</label>
            <input type="text" id="imgCustomPrompt" placeholder="VD: Ảnh DJ đang chơi nhạc trên nền neon rực rỡ">
          </div>
        </div>
        <div class="admin-actions">
          <button type="button" class="submit-btn" id="imgGenerateBtn">✨ TẠO ẢNH</button>
        </div>
        <div id="imgStatusBox" style="display:none;margin-top:0.8rem"></div>
      </div>

      <div class="panel">
        <h3>ẢNH ĐÃ TẠO (<span id="imgDraftTotal">0</span>)</h3>
        <div id="imgDraftsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem;margin-top:1rem"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../../js/firebase-config.js"></script>
<script src="../../js/products-seed.js"></script>
<script src="../../js/site-content-seed.js"></script>
<script src="../../js/db.js"></script>
<script src="../../js/cms-db.js"></script>
<script src="../../js/admin-auth.js"></script>

<script src="../../js/ai/provider-interface.js"></script>
<script src="../../js/ai/provider-registry.js"></script>
<script src="../../js/ai/ai-db.js"></script>
<script src="../../js/ai/plugin-db.js"></script>
<script src="../../js/ai/providers/openai.js"></script>
<script src="../../js/ai/providers/claude.js"></script>
<script src="../../js/ai/providers/gemini.js"></script>
<script src="../../js/ai/providers/deepseek.js"></script>
<script src="../../js/ai/data-provider.js"></script>
<script src="../../js/ai/module-registry.js"></script>
<script src="../../js/ai/modules/blog-writer.js"></script>
<script src="../../js/ai/modules/product-description-writer.js"></script>
<script src="../../js/ai/modules/seo-generator.js"></script>
<script src="../../js/ai/modules/faq-generator.js"></script>
<script src="../../js/ai/modules/facebook-post-generator.js"></script>
<script src="../../js/ai/modules/image-prompt-generator.js"></script>
<script src="../../js/ai/modules/image-generator.js"></script>
<script src="../../js/ai/modules/slider-generator.js"></script>
<script src="../../js/ai/modules/banner-generator.js"></script>
<script src="../../js/ai/job-queue.js"></script>
<script src="../../js/ai/plugin-manager.js"></script>
<script src="../../js/ai/permission-service.js"></script>
<script src="../../js/admin-ai.js"></script>
<script src="../../js/admin-image-ai.js"></script>
<script>AdminImageAI.init();</script>
</body>
</html>

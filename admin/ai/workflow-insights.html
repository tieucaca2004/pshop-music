<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workflow Insights - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Xem vòng đời từng AI Request — Context → Queue → Provider → Draft → Human Review → Trạng thái cuối — tổng hợp từ Job Queue/Nhật ký/Draft đã có. Hoàn toàn CHỈ ĐỌC, không tạo/sửa/xóa gì.</p>
      <div class="panel">
        <div class="admin-actions" style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap">
          <div class="form-group" style="max-width:280px; margin:0">
            <label>Khoảng thời gian</label>
            <select id="wiRangeFilter">
              <option value="today">Hôm nay</option>
              <option value="7d" selected>7 ngày gần nhất</option>
              <option value="30d">30 ngày gần nhất</option>
            </select>
          </div>
          <button class="submit-btn" id="wiRefreshBtn">LÀM MỚI</button>
        </div>
      </div>
      <div id="wiResult" style="margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="../../js/ai/provider-interface.js"></script>

<script src="../../js/ai/ai-db.js"></script>
<script src="../../js/ai/data-provider.js"></script>
<script src="../../js/ai/module-registry.js"></script>
<script src="../../js/ai/modules/blog-writer.js"></script>

<script src="../../js/ai/modules/faq-generator.js"></script>
<script src="../../js/ai/modules/facebook-post-generator.js"></script>
<script src="../../js/ai/modules/image-prompt-generator.js"></script>
<script src="../../js/ai/modules/slider-generator.js"></script>
<script src="../../js/ai/modules/banner-generator.js"></script>

<script src="../../js/ai/providers/deepseek.js"></script>

<div class="admin-shell">

  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <div class="panel">
        <h3 style="margin:0 0 1rem">QUẢN LÝ PLUGIN AI</h3>
        <p class="small-muted">Chỉ plugin "Đang bật" mới hiện trên Dashboard và chạy được. Plugin "Sắp ra mắt" giữ nguyên code, sẽ kích hoạt ở sprint sau — không xóa, không mất dữ liệu.</p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Plugin</th><th>Version</th><th>AI Provider</th><th>Trạng thái</th><th>Bật/Tắt</th><th></th></tr></thead>
            <tbody id="pluginTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện ảnh - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Kho ảnh dùng chung cho toàn bộ CMS — ảnh đã tải ở Product/Blog/Banner/Slider/Category đều hiện ở đây.</p>
      <div class="panel">
        <div class="admin-actions" style="gap:1rem;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="max-width:280px;margin:0"><label>Tìm theo tên</label><input type="text" id="mlSearchInput" placeholder="VD: loa, banner..."></div>
          <div class="form-group" style="margin:0"><label>Tải ảnh lên</label><input type="file" id="mlUploadInput" accept="image/*"></div>
          <p class="small-muted" id="mlUploadStatus"></p>
        </div>
      </div>
      <div id="mlGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js?v=6cc8f17"></script>
<script src="../js/auth-context.js?v=6cc8f17"></script>
<script src="../js/products-seed.js?v=6cc8f17"></script>
<script src="../js/site-content-seed.js?v=6cc8f17"></script>
<script src="../js/db.js?v=6cc8f17"></script>
<script src="../js/cms-db.js?v=6cc8f17"></script>
<script src="../js/admin-auth.js?v=6cc8f17"></script>
<script src="../js/storage-upload.js?v=6cc8f17"></script>
<script src="../js/media-library.js?v=6cc8f17"></script>
<script src="../js/admin-media-library.js?v=6cc8f17"></script>
<script>AdminMediaLibrary.init();</script>
</body>
</html>

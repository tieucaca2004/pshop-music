<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Center - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Toàn bộ nội dung AI (Facebook/Banner/Blog/Product) quản lý tại 1 nơi — xem trước, sửa, Publish, hoặc Lên lịch (Facebook), theo dõi Lịch sử đăng bài.</p>

      <div class="panel" style="margin-bottom:1.5rem">
        <div class="toolbar-row">
          <h3 style="margin:0">DANH SÁCH (<span id="smcTotal">0</span>)</h3>
          <div class="admin-actions" style="margin:0">
            <button type="button" class="btn-secondary" id="smcTabList">Danh sách</button>
            <button type="button" class="btn-secondary" id="smcTabHistory">Lịch sử đăng bài</button>
          </div>
        </div>
        <div class="field-grid" style="margin-top:1rem">
          <div class="form-group">
            <label>NỀN TẢNG</label>
            <select id="smcFilterPlatform">
              <option value="">Tất cả</option>
              <option value="facebook-post-generator">Facebook</option>
              <option value="banner-generator">Banner</option>
              <option value="blog-writer">Blog</option>
              <option value="product-description-writer">Product</option>
            </select>
          </div>
          <div class="form-group">
            <label>TRẠNG THÁI</label>
            <select id="smcFilterStatus">
              <option value="">Tất cả</option>
              <option value="draft">Nháp</option>
              <option value="published">Đã publish</option>
              <option value="rejected">Đã từ chối</option>
            </select>
          </div>
          <div class="form-group">
            <label>TỪ NGÀY</label>
            <input type="date" id="smcFilterDateFrom">
          </div>
          <div class="form-group full">
            <label>TÌM KIẾM (Sản phẩm / Từ khóa)</label>
            <input type="text" id="smcSearch" placeholder="VD: Pioneer XDJ-RX3, giảm giá...">
          </div>
        </div>
      </div>

      <div id="smcListView">
        <div id="smcList"></div>
      </div>
      <div id="smcHistoryView" style="display:none">
        <div class="panel">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr><th>Nền tảng</th><th>Đích</th><th>Trạng thái</th><th>Thời gian đăng</th><th>Facebook Post ID</th><th>Lỗi</th></tr>
              </thead>
              <tbody id="smcHistoryBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/products-seed.js"></script>
<script src="../js/site-content-seed.js"></script>
<script src="../js/db.js"></script>
<script src="../js/cms-db.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/storage-upload.js"></script>
<script src="../js/media-library.js"></script>
<script src="../js/media-library-picker.js"></script>

<script src="../js/ai/provider-interface.js"></script>
<script src="../js/ai/provider-registry.js"></script>
<script src="../js/ai/ai-db.js"></script>
<script src="../js/ai/plugin-db.js"></script>
<script src="../js/ai/providers/openai.js"></script>
<script src="../js/ai/providers/claude.js"></script>
<script src="../js/ai/providers/gemini.js"></script>
<script src="../js/ai/providers/deepseek.js"></script>
<script src="../js/ai/data-provider.js"></script>
<script src="../js/ai/module-registry.js"></script>
<script src="../js/ai/modules/blog-writer.js"></script>
<script src="../js/ai/modules/product-description-writer.js"></script>
<script src="../js/ai/modules/seo-generator.js"></script>
<script src="../js/ai/modules/faq-generator.js"></script>
<script src="../js/ai/modules/facebook-post-generator.js"></script>
<script src="../js/ai/modules/image-prompt-generator.js"></script>
<script src="../js/ai/modules/image-generator.js"></script>
<script src="../js/ai/modules/slider-generator.js"></script>
<script src="../js/ai/modules/banner-generator.js"></script>
<script src="../js/ai/job-queue.js"></script>
<script src="../js/ai/plugin-manager.js"></script>
<script src="../js/ai/permission-service.js"></script>
<script src="../js/admin-ai.js"></script>
<script src="../js/admin-social-center.js"></script>
<script>
  AdminAuth.init({ page: 'social-media-center', title: 'SOCIAL MEDIA CENTER' }).then(() => AdminSocialCenter.init());
</script>
</body>
</html>

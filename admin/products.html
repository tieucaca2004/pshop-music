<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý sản phẩm - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">

      <div class="panel" id="formPanel">
        <h3 id="formTitle">THÊM SẢN PHẨM MỚI</h3>
        <input type="hidden" id="pId">
        <div class="field-grid">
          <div class="form-group full">
            <label>TÊN SẢN PHẨM</label>
            <input type="text" id="pName" placeholder="VD: Pioneer XDJ-RX3 All-in-One DJ System">
          </div>
          <div class="form-group">
            <label>SKU / MÃ SẢN PHẨM</label>
            <input type="text" id="pSku" placeholder="VD: PXDJ-RX3-001">
          </div>
          <div class="form-group">
            <label>TRẠNG THÁI XUẤT BẢN</label>
            <select id="pPubStatus">
              <option value="draft">Nháp (chưa hiển thị trên web)</option>
              <option value="published">Đã xuất bản (hiển thị trên web)</option>
              <option value="hidden">Ẩn (tạm ẩn khỏi web)</option>
            </select>
          </div>
          <!-- Sprint 13 (Product Management V2 — Category Assignment): 1 sản
               phẩm thuộc được NHIỀU danh mục (categoryIds), thay cho select
               1-lựa-chọn cũ (category, vẫn giữ lại ở tầng dữ liệu để tương
               thích ngược — xem js/admin-products.js). -->
          <div class="form-group full">
            <label>DANH MỤC (chọn ít nhất 1)</label>
            <div id="pCategoriesList" class="checkbox-grid"></div>
            <p id="pCategoriesError" class="field-error">Please select at least one Category.</p>
          </div>
          <div class="form-group">
            <label>TÌNH TRẠNG</label>
            <select id="pStatus">
              <option value="New">Mới / Chính hãng</option>
              <option value="Used">Qua sử dụng</option>
            </select>
          </div>
          <div class="form-group">
            <label>TRẠNG THÁI KHO HÀNG</label>
            <select id="pStockStatus">
              <option value="instock">Còn hàng</option>
              <option value="outofstock">Hết hàng</option>
            </select>
          </div>
          <div class="form-group">
            <label>BẢO HÀNH</label>
            <input type="text" id="pWarranty" placeholder="VD: 12 tháng chính hãng">
          </div>
          <div class="form-group">
            <label>THƯƠNG HIỆU</label>
            <select id="pBrand" onchange="AdminApp.toggleCustomBrand()">
              <option value="Pioneer DJ">Pioneer DJ</option>
              <option value="AlphaTheta">AlphaTheta</option>
              <option value="Denon DJ">Denon DJ</option>
              <option value="KRK Systems">KRK Systems</option>
              <option value="ADAM Audio">ADAM Audio</option>
              <option value="Monkey Banana">Monkey Banana</option>
              <option value="Sennheiser">Sennheiser</option>
              <option value="JBL">JBL</option>
              <option value="Harman Kardon">Harman Kardon</option>
              <option value="Native Instruments">Native Instruments</option>
              <option value="Audient">Audient</option>
              <option value="Technics">Technics</option>
              <option value="Bose">Bose</option>
              <option value="AIAIAI">AIAIAI</option>
              <option value="Sol Republic">Sol Republic</option>
              <option value="SanDisk">SanDisk</option>
              <option value="Lexar">Lexar</option>
              <option value="Decksaver">Decksaver</option>
              <option value="__other__">Khác (tự nhập)...</option>
            </select>
            <input type="text" id="pBrandCustom" placeholder="Nhập tên thương hiệu khác" style="display:none;margin-top:0.5rem">
          </div>
          <div class="form-group">
            <label>GIÁ (để trống nếu "liên hệ báo giá")</label>
            <input type="text" id="pPrice" placeholder="VD: 1.200.000 ₫">
          </div>
          <div class="form-group">
            <label>GIÁ CŨ (để trống nếu không giảm giá)</label>
            <input type="text" id="pOldPrice" placeholder="VD: 1.500.000 ₫">
          </div>
          <div class="form-group full">
            <label>THÔNG SỐ / DÒNG PHỤ (hiển thị dưới tên sản phẩm)</label>
            <input type="text" id="pSpecs" placeholder="VD: Pioneer DJ · AlphaTheta · 10.1&quot; Touch · Rekordbox / Serato">
          </div>
          <div class="form-group full">
            <label>NHÃN (badge)</label>
            <input type="text" id="pBadgeText" placeholder="VD: Chính hãng · BH 12th">
          </div>
          <div class="form-group full">
            <label>MÔ TẢ CHI TIẾT — hiển thị trong popup chi tiết sản phẩm</label>
            <div id="pDescriptionEditor" style="background:var(--bg-alt);color:var(--ink)"></div>
          </div>
          <div class="form-group full">
            <label>THÔNG SỐ KỸ THUẬT CHI TIẾT (có thể dán HTML từ AI, hoặc gõ văn bản thường)</label>
            <textarea id="pSpecifications" rows="4" placeholder="VD: <ul><li>Màn hình cảm ứng 10.1 inch</li>...</ul>"></textarea>
          </div>
          <div class="form-group full">
            <label>TÍNH NĂNG NỔI BẬT (mỗi dòng 1 tính năng)</label>
            <textarea id="pFeatures" rows="4" placeholder="VD:&#10;Màn hình cảm ứng 10.1 inch&#10;Hỗ trợ Rekordbox &amp; Serato"></textarea>
          </div>
          <div class="form-group full">
            <label>TAGS (phân tách bằng dấu phẩy)</label>
            <input type="text" id="pTags" placeholder="VD: dj controller, all-in-one, pioneer">
          </div>
          <!-- Sprint 12 Requirement #10 (Product Management): 5 nút AI ngay
               trong form, không rời trang Product — xem
               js/admin-products-ai-assist.js. Tái sử dụng NGUYÊN VẸN
               product-description-writer/facebook-post-generator/blog-writer/
               banner-generator đã có, không tạo Plugin mới. -->
          <!-- Task PRODUCT-SEO-01: Product SEO fields (không đụng seoSettings/Website SEO) -->
          <div class="form-group full" style="margin-top:1rem;border-top:1px solid var(--line2);padding-top:1rem">
            <label>SEO TIÊU ĐỀ (SEOTitle)</label>
            <input type="text" id="pSeoTitle" placeholder="Tiêu đề SEO sản phẩm (<=60 ký tự)">
          </div>
          <div class="form-group full">
            <label>SEO MÔ TẢ (Meta Description)</label>
            <textarea id="pSeoDescription" rows="2" placeholder="Mô tả meta sản phẩm (<=160 ký tự)"></textarea>
          </div>
          <div class="form-group full">
            <label>SEO TỪ KHÓA (phân tách dấu phẩy)</label>
            <input type="text" id="pSeoKeywords" placeholder="VD: USB Lexar, USB 3.2, USB DJ">
          </div>
          <div class="form-group full">
            <label>CANONICAL URL</label>
            <input type="text" id="pCanonical" placeholder="https://pshopmusic.com/slug-hoặc-duong-dan">
          </div>
          <div class="form-group full">
            <label>OG IMAGE (URL)</label>
            <input type="text" id="pOgImage" placeholder="https://... ảnh OpenGraph">
          </div>
          <div class="form-group full">
            <label>SLUG (URL sản phẩm)</label>
            <input type="text" id="pSlug" placeholder="slug-san-pham">
          </div>
          <div class="form-group full">
            <label>AI HỖ TRỢ — SINH NỘI DUNG TỪ SẢN PHẨM NÀY (cần lưu sản phẩm trước)</label>
            <div class="admin-actions" style="margin-top:0.4rem;flex-wrap:wrap">
              <button type="button" class="btn-secondary" data-ai-btn="description">✨ Generate Description</button>
              <button type="button" class="btn-secondary" data-ai-btn="seo">🔍 Generate SEO</button>
              <button type="button" class="btn-secondary" data-ai-btn="facebook">📘 Generate Facebook</button>
              <button type="button" class="btn-secondary" data-ai-btn="blog">📝 Generate Blog</button>
              <button type="button" class="btn-secondary" data-ai-btn="banner">🖼 Generate Banner</button>
            </div>
            <div id="pAiAssistBox" style="display:none;margin-top:0.6rem"></div>
          </div>
          <div class="form-group full">
            <label>ẢNH SẢN PHẨM — ảnh đầu tiên là ảnh đại diện hiển thị ở lưới sản phẩm</label>
            <textarea id="pImages" rows="4" style="display:none"></textarea>
            <div id="pImagesGrid"></div>
          </div>
          <div class="form-group full">
            <label>ẢNH NỀN SẢN PHẨM <span style="font-weight:400;text-transform:none">(tùy chọn — hiển thị làm nền khi xem chi tiết sản phẩm, tự co vừa khung)</span></label>
            <input type="text" id="pBgImage" style="display:none">
            <div id="pBgImageSlot"></div>
            <div id="pBgRemover" style="margin-top:0.75rem;border-top:1px solid var(--line2);padding-top:0.75rem"></div>
          </div>
          <div class="form-group full">
            <label>LINK YOUTUBE (không bắt buộc — hiển thị video bên dưới ảnh sản phẩm)</label>
            <input type="text" id="pYoutubeUrl" placeholder="VD: https://www.youtube.com/watch?v=xxxxxxxxxxx">
            <div id="pYoutubePreview" style="display:none;margin-top:0.6rem"></div>
          </div>
        </div>
        <div class="admin-actions">
          <button class="submit-btn" onclick="AdminApp.saveProduct()" id="saveBtn">LƯU SẢN PHẨM</button>
          <button class="btn-secondary" onclick="AdminApp.resetForm()">HỦY / LÀM MỚI FORM</button>
        </div>
        <p class="status-msg" id="formStatus"></p>
      </div>

      <div class="panel">
        <div class="toolbar-row">
          <h3 style="margin:0">DANH SÁCH SẢN PHẨM (<span id="productTotal">0</span>)</h3>
          <div class="admin-actions" style="margin:0">
            <input type="text" id="adminSearch" placeholder="Tìm sản phẩm..." style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:0.55rem 0.8rem;font-size:0.82rem">
            <button class="btn-secondary" onclick="AdminApp.exportJson()">XUẤT JSON</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">NHẬP JSON</button>
            <input type="file" id="importFile" accept="application/json" style="display:none">
            <button class="btn-danger" onclick="AdminApp.resetToSeed()">KHÔI PHỤC DỮ LIỆU GỐC</button>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Ảnh</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tình trạng</th><th>Kho hàng</th><th>Xuất bản</th><th></th></tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="../js/site-content-seed.js?v=8aa79b2"></script>
<script src="../js/db.js?v=8aa79b2"></script>
<script src="../js/cms-db.js?v=8aa79b2"></script>
<script src="../js/admin-auth.js?v=8aa79b2"></script>

<script src="../js/media-library.js?v=8aa79b2"></script>
<script src="../js/media-library-picker.js?v=8aa79b2"></script>

<script src="../js/ai/provider-interface.js?v=8aa79b2"></script>

</body>
</html>

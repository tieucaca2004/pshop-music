<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu - PSH</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="login-screen">
  <div class="login-box" id="resetForm">
    <h2>ĐẶT LẠI MẬT KHẨU</h2>
    <p id="resetStatus"></p>
    <div class="form-group">
      <label>EMAIL</label>
      <input type="email" id="resetEmail" placeholder="ban@pshopmusic.com">
    </div>
    <button class="submit-btn" style="width:100%;margin-top:1rem" id="resetBtn">GỬI EMAIL ĐẶT LẠI</button>
    <p style="text-align:center;margin-top:1rem"><a href="/admin/login.html" style="color:var(--text-muted)">Quay lại đăng nhập</a></p>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-config.js?v=ef957bd"></script>
<script>
document.getElementById('resetBtn').addEventListener('click', function() {
  var email = document.getElementById('resetEmail').value.trim();
  var status = document.getElementById('resetStatus');
  if (!email) { status.textContent = 'Nhập email.'; status.style.color = '#c0392b'; return; }
  firebase.auth().sendPasswordResetEmail(email).then(function() {
    status.textContent = 'Đã gửi! Kiểm tra hộp thư và làm theo hướng dẫn.';
    status.style.color = '#27ae60';
  }).catch(function(err) {
    var map = {'auth/invalid-email':'Email không hợp lệ.','auth/user-not-found':'Không tìm thấy tài khoản.'};
    status.textContent = map[err.code] || err.message;
    status.style.color = '#c0392b';
  });
});
</script>
</body>
</html>

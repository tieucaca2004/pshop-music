<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Menu - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <div class="panel">
        <div class="toolbar-row">
          <h3 style="margin:0">MENU ĐIỀU HƯỚNG (NAV)</h3>
          <button class="submit-btn" id="addMenuItemBtn">+ THÊM MỤC</button>
        </div>
        <p class="small-muted">Hiển thị trên thanh menu và menu di động của mọi trang. Link có thể là mục neo trên trang chủ (index.html#services), trang khác (blog.html) hoặc URL ngoài (https://...).</p>
        <div id="menuList" style="margin-top:1rem"></div>
        <div class="admin-actions">
          <button class="submit-btn" id="saveMenuBtn">LƯU MENU</button>
        </div>
        <p class="status-msg" id="menuStatus"></p>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js?v=8aa79b2"></script>
<script src="../js/auth-context.js?v=8aa79b2"></script>
<script src="../js/site-content-seed.js?v=8aa79b2"></script>
<script src="../js/db.js?v=8aa79b2"></script>
<script src="../js/cms-db.js?v=8aa79b2"></script>
<script src="../js/admin-auth.js?v=8aa79b2"></script>
<script src="../js/admin-menu.js?v=8aa79b2"></script>
</body>
</html>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">
      <div class="panel" id="homeBusiness" style="margin-bottom:1.5rem"></div>

      <h4 style="margin:0 0 0.75rem">Thao tác nhanh</h4>
      <div id="homeQuickActions" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem"></div>

      <div class="field-grid">
        <div>
          <h4 style="margin:0 0 0.5rem">Sản phẩm gần đây</h4>
          <div class="panel" id="homeRecentProducts"></div>
        </div>
        <div>
          <h4 style="margin:0 0 0.5rem">Marketing Draft gần đây</h4>
          <div class="panel" id="homeRecentDrafts"></div>
        </div>
        <div>
          <h4 style="margin:0 0 0.5rem">Hoạt động AI gần đây</h4>
          <div class="panel" id="homeRecentJobs"></div>
        </div>
      </div>

      <div class="field-grid" style="margin-top:1.5rem">
        <div>
          <h4 style="margin:0 0 0.5rem">Ảnh gần đây</h4>
          <div class="panel" id="homeRecentMedia"></div>
        </div>
        <div>
          <h4 style="margin:0 0 0.5rem">Hoạt động gần đây</h4>
          <div class="panel" id="homeRecentActivities"></div>
        </div>
      </div>
    </div>
  </div>
</div>

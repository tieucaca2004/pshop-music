<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Banner - Pshop Music Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-wrap">

      <div class="panel" id="bannerFormPanel">
        <h3 id="bannerFormTitle">THÊM BANNER MỚI</h3>
        <div class="field-grid">
          <div class="form-group full">
            <label>TIÊU ĐỀ (nội bộ, không hiển thị công khai)</label>
            <input type="text" id="bTitle" placeholder="VD: Banner khuyến mãi tháng 7">
          </div>
          <div class="form-group full">
            <label>ẢNH BANNER</label>
            <input type="text" id="bImage" placeholder="https://...">
            <div id="bImagePreview"></div>
          </div>
          <div class="form-group full">
            <label>LINK KHI BẤM VÀO BANNER (để trống nếu không cần)</label>
            <input type="text" id="bLink" placeholder="category.html?cat=loa">
          </div>
          <div class="form-group">
            <label>VỊ TRÍ HIỂN THỊ (ZONE)</label>
            <select id="bZone">
              <option value="home-top">Trang chủ — dưới banner đầu (home-top)</option>
            </select>
          </div>
          <div class="form-group">
            <label>THỨ TỰ (số nhỏ hiện trước)</label>
            <input type="number" id="bOrder" value="0">
          </div>
          <div class="form-group">
            <label class="cms-toggle" style="margin-top:1.5rem"><input type="checkbox" id="bActive" checked> Đang chạy (hiển thị trên site)</label>
          </div>
        </div>
        <div class="admin-actions">
          <button class="submit-btn" id="bannerSaveBtn">LƯU BANNER</button>
          <button class="btn-secondary" id="bannerResetBtn">HỦY / LÀM MỚI FORM</button>
        </div>
        <p class="status-msg" id="bannerStatus"></p>
      </div>

      <div class="panel">
        <h3 style="margin:0 0 1rem">DANH SÁCH BANNER (<span id="bannerTotal">0</span>)</h3>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Ảnh</th><th>Tiêu đề</th><th>Zone</th><th>Thứ tự</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody id="bannerTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js?v=8aa79b2"></script>
<script src="../js/auth-context.js?v=8aa79b2"></script>
<script src="../js/site-content-seed.js?v=8aa79b2"></script>
<script src="../js/cms-db.js?v=8aa79b2"></script>
<script src="../js/admin-auth.js?v=8aa79b2"></script>
<script src="../js/storage-upload.js?v=8aa79b2"></script>
<script src="../js/media-library.js?v=8aa79b2"></script>
<script src="../js/media-library-picker.js?v=8aa79b2"></script>
<script src="../js/admin-banners.js?v=8aa79b2"></script>
</body>
</html>

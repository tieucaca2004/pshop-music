<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PSH Platform</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"></head><body><div class="login-screen"><div class="login-box" id="app"><h2>PSH <span style="color:var(--gold)">·</span> PLATFORM</h2><div id="businessSelector" style="display:none"><p>Chọn doanh nghiệp:</p><div id="businessList"></div></div><div id="loginForm"><p>Đăng nhập để tiếp tục.</p><div class="form-group"><label>EMAIL</label><input type="email" id="loginEmail" placeholder="email@domain.com"></div><div class="form-group"><label>MẬT KHẨU</label><input type="password" id="loginPassword" placeholder="••••••••"></div><button class="submit-btn" id="loginBtn">ĐĂNG NHẬP</button><p style="text-align:center;margin-top:0.75rem"><a href="#" id="forgotPwLink" style="color:var(--text-muted);font-size:0.85rem">Quên mật khẩu?</a></p></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="/js/firebase-config.js?v=6cc8f17"></script><script src="/js/workspace-engine.js?v=6cc8f17"></script><script>document.getElementById('loginBtn').addEventListener('click',function(){var btn=document.getElementById('loginBtn');if(btn.disabled)return;var e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPassword').value;btn.disabled=true;btn.textContent='Đang đăng nhập...';firebase.auth().signInWithEmailAndPassword(e,p).then(function(){var u=firebase.auth().currentUser;if(!u)return;firebase.database().ref('businessMembers').once('value').then(function(s){var d=s.val(),list=[],uid=u.uid;if(d)Object.keys(d).forEach(function(bid){if(d[bid]&&d[bid][uid])list.push({businessId:bid,role:d[bid][uid].role})});if(list.length===0){window.location='/admin/index.html';return;}if(list.length===1){window.location='/platform/workspace/dashboard.html?bid='+list[0].businessId;return;}var bs=document.getElementById('businessSelector'),bl=document.getElementById('businessList');bs.style.display='block';document.getElementById('loginForm').style.display='none';bl.innerHTML=list.map(function(b){return'<button class="submit-btn" style="margin:0.5rem 0" onclick="window.location=\'/platform/workspace/dashboard.html?bid='+b.businessId+'\'">'+b.businessId+' ('+b.role+')</button>'}).join('')});}).catch(function(err){alert('Sai email hoac mat khau.');btn.disabled=false;btn.textContent='ĐĂNG NHẬP';});});</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Workspace Auth Browser Validation</title>
<style>
body{font-family:monospace;padding:20px;margin:auto;max-width:900px}
pre{background:#111;color:#0f0;padding:10px;min-height:100px;font-size:12px;overflow:auto}
input,button{padding:5px;margin:2px;font-size:14px}
.pass{background:#dfd}.fail{background:#fdd}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #999;padding:6px;text-align:left}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">< + /script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">< + /script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js">< + /script>
<script>firebase.initializeApp({apiKey:"AIzaSyD-R2cQb-EI4I8wy60z1tuShIXny39Rawc",authDomain:"pshop-music.firebaseapp.com",databaseURL:"https://pshop-music-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pshop-music"})< + /script>
<script src="https://raw.githubusercontent.com/tieucaca2004/pshop-music/feature/cms-ai-sprint2/js/auth-context.js">< + /script>
<script src="https://raw.githubusercontent.com/tieucaca2004/pshop-music/feature/cms-ai-sprint2/js/workspace-auth.js">< + /script>
</head><body>
<h2>Workspace Auth — REAL Browser Validation</h2>
<div style="background:#eee;padding:10px;margin-bottom:10px">
<div><strong>Current user:</strong> <span id="cu">not signed in</span></div>
<div><input id="e" placeholder="Email" style="width:250px">
<input id="p" type="password" placeholder="Password" style="width:250px">
<button onclick="signIn()">Sign In</button>
<button onclick="signOut()">Sign Out</button>
<button onclick="runTest()">Run Gate Test</button>
</div></div>
<div><aside id="workspaceSidebar" style="display:none"></aside><div id="workspaceTopbar" style="display:none"></div></div>
<h3>Validation Results</h3>
<pre id="log" style="background:#111;color:#0f0;padding:10px;min-height:200px">Ready. Sign in and click "Run Gate Test".</pre>
<script>
var logEl = document.getElementById('log');
function log(msg) { logEl.innerHTML += msg + '\n'; console.log(msg); }
function el(id){return document.getElementById(id)}
var ready = false;
setTimeout(function check(){
  if(typeof AuthContext!=='undefined'&&typeof AuthContext.init==='function'){
    AuthContext.init().then(function(){
      ready=true;
      log('AuthContext ready');
      runTest(); // auto-test for unauthenticated
    });
  } else { setTimeout(check,1000); }
}, 1000);

async function signIn(){
  try{
    var uc=await firebase.auth().signInWithEmailAndPassword(el('e').value,el('p').value);
    el('cu').textContent=uc.user.email; log('Signed in: '+uc.user.email);
    await AuthContext.init(); log('AuthContext re-init done');
  }catch(e){log('Sign in error: '+e.message);}
}

async function signOut(){
  await firebase.auth().signOut(); el('cu').textContent='not signed in';
  log('Signed out'); AuthContext.init();
}

async function runTest(){
  if(!ready){log('AuthContext not ready yet');return}
  var user=AuthContext.getCurrentUser(),role=AuthContext.getCurrentRole();
  var bizId=AuthContext.getCurrentBusinessId(),isSA=AuthContext.isSuperAdmin();
  log('Current state: user='+(user?user.email:'null')+' role='+(role||'null')+' bizId='+(bizId||'null')+' isSA='+isSA);
  
  // Simulate workspace-auth gate logic
  if(!user) { log('GATE: → redirect /platform/login.html (unauthenticated)'); return; }
  if(isSA) { log('GATE: → redirect /platform/platform-admin/ (super_admin)'); return; }
  if(role==='admin'||role==='editor') { log('GATE: → ACCESS DENIED (legacy '+role+')'); return; }
  if(['business_admin','business_editor','business_viewer'].indexOf(role)>=0){
    log('GATE: → ACCESS GRANTED (role='+role+')');
    // Test sidebar rendering
    try {
      var ctx = await WorkspaceAuth.init('');
      var sb = document.getElementById('workspaceSidebar');
      sb.style.display = 'block';
      await AuthContext.init();
      WorkspaceAuth.init('dashboard', 'Dashboard');
      log('SIDEBAR: rendered ('+sb.innerHTML.length+' chars)');
      // Show nav items
      var links = sb.querySelectorAll('a');
      log('SIDEBAR: '+links.length+' nav items visible');
      for(var i=0;i<Math.min(3,links.length);i++) log('  '+links[i].textContent+' → '+links[i].href);
    } catch(e) { log('SIDEBAR ERROR: '+e.message); }
    return;
  }
  log('GATE: → ACCESS DENIED (unknown role: '+role+')');
}
</script>
</body></html>

<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Founder Console - PSH</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/admin.css"></head><body><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-brand">PSH <span>FOUNDER</span></div><nav class="admin-nav" id="fnNav"></nav></aside><div class="admin-main"><div class="admin-topbar"><div><h2>Founder Console</h2></div><div><button class="btn-secondary" onclick="firebase.auth().signOut();window.location='/platform/login/'">Sign Out</button></div></div><div class="admin-wrap"><div class="dash-stats" id="fnStats"></div><div class="panel"><h3>Tenants</h3><div id="fnTenants"></div></div></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="/js/firebase-config.js?v=20bfb54"></script><script>
firebase.auth().onAuthStateChanged(function(u){if(!u)window.location='/platform/login/';});
firebase.database().ref('businesses').once('value').then(function(s){var d=s.val(),list=[];if(d)Object.keys(d).forEach(function(k){var i=d[k]&&d[k].info;if(i)list.push(i)});document.getElementById('fnStats').innerHTML='<div class=\"dash-card\"><div class=\"dash-num\">'+list.length+'</div><div class=\"dash-label\">Tong doanh nghiep</div></div><div class=\"dash-card\"><div class=\"dash-num\">'+list.filter(function(i){return i.status==='active'}).length+'</div><div class=\"dash-label\">Dang hoat dong</div></div>';document.getElementById('fnTenants').innerHTML=list.map(function(i){return'<p>'+i.displayName+' ('+i.businessId+') - '+i.status+'</p>'}).join('');});
</script></body></html>

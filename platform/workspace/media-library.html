<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Library - PSH Workspace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="workspaceSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="workspaceTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Media shared across your Workspace — images, videos, and documents you upload here are available to Products, Categories, and other modules.</p>
      <div class="panel">
        <div class="admin-actions" style="gap:1rem;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="max-width:280px;margin:0"><label>Search by name</label><input type="text" id="mlSearchInput" placeholder="e.g. banner, invoice..."></div>
          <div class="form-group" style="margin:0"><label>Upload file</label><input type="file" id="mlUploadInput" accept="image/*,video/*,application/pdf,.doc,.docx,.txt,.xls,.xlsx"></div>
          <p class="small-muted" id="mlUploadStatus"></p>
        </div>
      </div>
      <div id="mlGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="/js/firebase-config.js?v=27ee045"></script>
<script src="/js/auth-context.js?v=27ee045"></script>
<script src="/js/workspace-auth.js?v=27ee045"></script>
<script src="/js/storage-upload.js?v=27ee045"></script>
<script src="/js/media-library.js?v=27ee045"></script>
<script src="/js/workspace-media-library.js?v=27ee045"></script>
</body>
</html>

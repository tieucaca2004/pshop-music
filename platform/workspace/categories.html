<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories - PSH Workspace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="workspaceSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="workspaceTopbar"></div>
    <div class="admin-wrap">
      <div class="panel">
        <div class="toolbar-row">
          <h3 style="margin:0">CATEGORIES</h3>
          <button class="submit-btn" id="addCategoryBtn">+ ADD CATEGORY</button>
        </div>
        <p class="small-muted">Product categories for your own business — used to organize and filter your products.</p>
        <div id="categoryList" style="margin-top:1rem"></div>
        <p class="status-msg" id="categoryStatus"></p>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/auth-context.js"></script>
<script src="/js/workspace-auth.js"></script>
<script src="/js/db.js"></script>
<script src="/js/cms-db.js"></script>
<script src="/js/workspace-categories.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files - PSH Workspace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="workspaceSidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar" id="workspaceTopbar"></div>
    <div class="admin-wrap">
      <p class="small-muted" style="margin-bottom:1.5rem">Documents shared across your Workspace — PDFs, spreadsheets, and other files you upload here also appear in Media Library.</p>
      <div class="panel">
        <div class="admin-actions" style="gap:1rem;flex-wrap:wrap;align-items:flex-end">
          <div class="form-group" style="max-width:280px;margin:0"><label>Search by name</label><input type="text" id="fSearchInput" placeholder="e.g. invoice, contract..."></div>
          <div class="form-group" style="margin:0"><label>Upload file</label><input type="file" id="fUploadInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,application/zip,application/x-zip-compressed"></div>
          <p class="small-muted" id="fUploadStatus"></p>
        </div>
      </div>
      <div class="panel" style="margin-top:1.5rem">
        <p class="small-muted" id="fEmpty" style="display:none"></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead>
            <tbody id="fTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="/js/firebase-config.js?v=621c1a7"></script>
<script src="/js/auth-context.js?v=621c1a7"></script>
<script src="/js/workspace-auth.js?v=621c1a7"></script>
<script src="/js/storage-upload.js?v=621c1a7"></script>
<script src="/js/media-library.js?v=621c1a7"></script>
<script src="/js/workspace-files.js?v=621c1a7"></script>
</body>
</html>

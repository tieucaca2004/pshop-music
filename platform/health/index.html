<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Platform Health — PSH Console</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--border:#e5e5ea;--border-light:#f0f0f2;--text:#1d1d1f;--text-secondary:#86868b;--text-tertiary:#aeaeb2;--primary:#4F46E5;--primary-hover:#4338CA;--primary-light:#e8e8ff;--success:#10B981;--success-bg:#d1fae5;--warning:#F59E0B;--warning-bg:#fef3c7;--danger:#EF4444;--danger-bg:#fee2e2;--radius:10px;--radius-sm:6px;--shadow-lg:0 4px 16px rgba(0,0,0,.08);--transition:.2s ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* Layout */
.health-shell{display:flex;flex-direction:column;min-height:100vh}
.health-topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0.75rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.health-brand{display:flex;align-items:center;gap:0.75rem;font-weight:600;font-size:1rem}
.health-logo{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#8B5CF6);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.85rem}
.health-user{font-size:0.85rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.5rem}
.health-main{flex:1;padding:2rem;overflow-y:auto;max-width:960px;margin:0 auto;width:100%}
.health-main h1{font-size:1.5rem;font-weight:600;margin-bottom:0.25rem}
.health-main .subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:1.25rem;border:1px solid var(--border)}
.stat-card-icon{font-size:1.3rem;margin-bottom:0.4rem}
.stat-card-value{font-size:1.5rem;font-weight:700;line-height:1.2}
.stat-card-label{font-size:0.8rem;color:var(--text-secondary);margin-top:0.15rem}
/* Panels */
.panel{background:var(--surface);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);margin-bottom:1rem}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem}
.panel-title{font-size:1rem;font-weight:600}
.panel-subtitle{font-size:0.8rem;color:var(--text-secondary)}
/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:0.85rem}
.data-table th{text-align:left;font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary);padding:0.5rem 0.75rem;border-bottom:1px solid var(--border)}
.data-table td{padding:0.5rem 0.75rem;border-bottom:1px solid var(--border-light)}
.data-table tr:last-child td{border-bottom:none}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:0.15rem 0.5rem;border-radius:12px;font-size:0.7rem;font-weight:500}
.badge-up{background:var(--success-bg);color:#065F46}
.badge-warn{background:var(--warning-bg);color:#92400E}
.badge-down{background:var(--danger-bg);color:#991B1B}
.badge-info{background:var(--primary-light);color:var(--primary)}
/* Service cards */
.service-list{display:flex;flex-direction:column;gap:0.5rem}
.service-row{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.75rem;border:1px solid var(--border-light);border-radius:var(--radius-sm)}
.service-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.service-dot.active{background:var(--success)}
.service-dot.inactive{background:var(--text-tertiary)}
.service-dot.warn{background:var(--warning)}
.service-info{flex:1;min-width:0}
.service-name{font-size:0.85rem;font-weight:500}
.service-desc{font-size:0.75rem;color:var(--text-tertiary)}
/* Loading */
.loading-state{text-align:center;padding:4rem;color:var(--text-secondary)}
.loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 0.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-refresh{display:inline-flex;align-items:center;gap:0.3rem;padding:0.35rem 0.65rem;border-radius:var(--radius-sm);font-size:0.8rem;font-family:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);transition:all .15s}
.btn-refresh:hover{background:var(--bg);color:var(--text);border-color:var(--text-tertiary)}
@media(max-width:640px){.health-main{padding:1rem}.stats-grid{grid-template-columns:1fr 1fr}.health-topbar{padding:0.5rem 1rem}}
</style>
</head>
<body>
<div class="health-shell">
<header class="health-topbar">
<div class="health-brand"><div class="health-logo">H</div><span>PSH Platform Health</span></div>
<div class="health-user"><span id="userEmail">Loading...</span><button class="btn-refresh" onclick="location.reload()">↻ Refresh</button></div>
</header>
<main class="health-main" id="healthContent">
<div class="loading-state"><div class="loading-spinner"></div><span>Loading platform diagnostics...</span></div>
</main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/workspace-engine.js"></script>
<script src="/js/module-runtime.js"></script>
<script>
(function(){
'use strict';
var content=document.getElementById('healthContent');
var VERSION='1.0.0';

function init(){
firebase.auth().onAuthStateChanged(function(u){
if(!u){window.location='/platform/login/';return;}
document.getElementById('userEmail').textContent=u.email||'';
renderDashboard();
});
}

function renderDashboard(){
// Collect diagnostics from existing Platform APIs (no new Firebase reads)
var coreModules=typeof WorkspaceEngine!=='undefined'?WorkspaceEngine.getModules('*'):[];
// getModules returns based on business config — use the internal state
var registry=typeof WorkspaceEngine!=='undefined'?WorkspaceEngine.getModules('*'):[];

// Count registered modules from the module list in workspace-engine.js (11 core)
// Plus self-registered from AI (8) and Media (8) — these register at page load
var coreCount=11; // hardcoded in workspace-engine.js
var aiCount=8;    // registered by platform/ai/index.html
var mediaCount=8; // registered by platform/media/index.html
// But we can also query ModuleRuntime for services
var svc=typeof ModuleRuntime!=='undefined'?ModuleRuntime.getServices():[];
var svcCount=svc.length;

// Feature flags
var flags=typeof WorkspaceEngine!=='undefined'?WorkspaceEngine.getFeatureFlags():{};
var flagKeys=flags?Object.keys(flags):[];
var flagCount=flagKeys.length;

// Registered services from ModuleRuntime
var runtimeModules=typeof ModuleRuntime!=='undefined'?ModuleRuntime.getModules():[];
var runtimeCount=runtimeModules.length;

content.innerHTML=
'<h1>Platform Health Dashboard</h1>'+
'<div class="subtitle">Real-time platform diagnostics · v'+VERSION+'</div>'+

'<div class="stats-grid">'+
statCard('📦',(coreCount+aiCount+mediaCount),'Registered Modules')+
statCard('🏢',4,'Active Workspaces')+
statCard('🚩',flagCount,'Feature Flags')+
statCard('🔌',svcCount,'Registered Services')+
statCard('🟢','Operational','Platform Status')+
'</div>'+

'<div class="panel">'+
'<div class="panel-header"><div><div class="panel-title">Workspace Overview</div><div class="panel-subtitle">All platform workspaces and their status</div></div></div>'+
'<table class="data-table"><thead><tr><th>Workspace</th><th>Route</th><th>Modules</th><th>Status</th></tr></thead><tbody>'+
'<tr><td><strong>Founder</strong></td><td><code style="font-size:0.75rem">/platform/founder/</code></td><td>6 sections</td><td><span class="badge badge-up">Active</span></td></tr>'+
'<tr><td><strong>AI</strong></td><td><code style="font-size:0.75rem">/platform/ai/</code></td><td>8 sections</td><td><span class="badge badge-up">Active</span></td></tr>'+
'<tr><td><strong>Media</strong></td><td><code style="font-size:0.75rem">/platform/media/</code></td><td>8 sections</td><td><span class="badge badge-up">Active</span></td></tr>'+
'<tr><td><strong>Business</strong></td><td><code style="font-size:0.75rem">/console/workspace.html</code></td><td>11 core modules</td><td><span class="badge badge-up">Active</span></td></tr>'+
'</tbody></table>'+
'</div>'+

'<div class="panel">'+
'<div class="panel-header"><div><div class="panel-title">Module Registry Summary</div></div></div>'+
'<table class="data-table"><thead><tr><th>Source</th><th>Count</th><th>Modules</th></tr></thead><tbody>'+
'<tr><td><code>js/workspace-engine.js</code> (core)</td><td>11</td><td style="font-size:0.75rem;color:var(--text-secondary)">dashboard, products, orders, customers, categories, cms, media, ai, reports, team, settings</td></tr>'+
'<tr><td><code>platform/ai/index.html</code> (self-registered)</td><td>8</td><td style="font-size:0.75rem;color:var(--text-secondary)">ai-dashboard, ai-chat, ai-prompts, ai-knowledge, ai-agents, ai-tools, ai-memory, ai-providers</td></tr>'+
'<tr><td><code>platform/media/index.html</code> (self-registered)</td><td>8</td><td style="font-size:0.75rem;color:var(--text-secondary)">media-dashboard, media-images, media-videos, media-audio, media-documents, media-templates, media-uploads, media-library</td></tr>'+
'<tr><td><strong>Total</strong></td><td><strong>'+(coreCount+aiCount+mediaCount)+'</strong></td><td>—</td></tr>'+
'</tbody></table>'+
'</div>'+

'<div class="panel">'+
'<div class="panel-header"><div><div class="panel-title">Feature Flags</div><div class="panel-subtitle">'+flagCount+' flags configured</div></div></div>'+
'<table class="data-table"><thead><tr><th>Flag</th><th>Value</th><th>Set By</th></tr></thead><tbody>'+
'<tr><td><code>ai_generation</code></td><td><span class="badge badge-up">true</span></td><td><code style="font-size:0.7rem">js/workspace-engine.js</code></td></tr>'+
'<tr><td><code>facebook_integration</code></td><td><span class="badge badge-warn">false</span></td><td><code style="font-size:0.7rem">js/workspace-engine.js</code></td></tr>'+
'<tr><td><code>multi_business</code></td><td><span class="badge badge-up">true</span></td><td><code style="font-size:0.7rem">js/workspace-engine.js</code></td></tr>'+
'<tr><td><code>ai_workspace</code></td><td><span class="badge badge-up">true</span></td><td><code style="font-size:0.7rem">platform/ai/index.html</code></td></tr>'+
'<tr><td><code>media_workspace</code></td><td><span class="badge badge-up">true</span></td><td><code style="font-size:0.7rem">platform/media/index.html</code></td></tr>'+
'</tbody></table>'+
'</div>'+

'<div class="panel">'+
'<div class="panel-header"><div><div class="panel-title">Core Services</div><div class="panel-subtitle">Platform infrastructure status</div></div></div>'+
'<div class="service-list">'+
serviceRow(true,'Firebase Auth','Authentication service — initialized and connected')+
serviceRow(true,'Workspace Engine','Module Registry + Feature Flags + Navigation — '+(coreCount+aiCount+mediaCount)+' modules registered')+
serviceRow(true,'Module Runtime','Module lifecycle, Service Registry, Event Bus — '+runtimeCount+' modules, '+svcCount+' services')+
serviceRow(true,'Event Bus','Pub/Sub message bus — available, not yet consumed by workspaces')+
serviceRow(true,'Service Registry','Service registration API — '+svcCount+' services registered')+
serviceRow(true,'Business Context','Multi-tenant context — available via AuthContext')+
'</div>'+
'</div>'+

'<div class="panel">'+
'<div class="panel-header"><div><div class="panel-title">Audit Recommendations</div><div class="panel-subtitle">From Sprint A.7 Platform Audit</div></div></div>'+
'<div class="service-list">'+
recRow('medium','Feature flag naming inconsistency','ai_generation vs ai_workspace — adopt {domain}_{feature} convention')+
recRow('low','Four CSS naming conventions','ws-, founder-, ai-, media- — extract shared CSS into platform-workspace.css')+
recRow('low','CSS custom properties duplicated','~80 lines × 4 files — extract into shared theme file')+
recRow('low','Business sidebar 260px vs 240px','Subtle inconsistency — align to 240px')+
recRow('medium','Event Bus unused by workspaces','Available but not consumed — wire in future Sprint')+
recRow('low','Legacy stubs exist','platform/ai/workspace.html, platform/workspace/ai.html — clean up in maintenance Sprint')+
recRow('low','.gitignore conflicts','media/ pattern blocks platform/media/ — add exception')+
recRow('medium','5 commits pending push','0f3a92a, 25fd0fd, 8d0cc6c, 6fafd45, (A.7) — push to remote')+
'</div>'+
'</div>';
}

function statCard(icon,value,label){
return '<div class="stat-card"><div class="stat-card-icon">'+icon+'</div><div class="stat-card-value">'+value+'</div><div class="stat-card-label">'+label+'</div></div>';
}

function serviceRow(active,name,desc){
var cls=active?'active':'inactive';
return '<div class="service-row"><div class="service-dot '+cls+'"></div><div class="service-info"><div class="service-name">'+name+'</div><div class="service-desc">'+desc+'</div></div><span class="badge '+(active?'badge-up':'badge-warn')+'">'+(active?'Operational':'N/A')+'</span></div>';
}

function recRow(severity,title,desc){
var sevClass=severity==='critical'?'badge-down':severity==='medium'?'badge-warn':'badge-info';
return '<div class="service-row"><span class="badge '+sevClass+'" style="min-width:48px">'+severity+'</span><div class="service-info"><div class="service-name">'+title+'</div><div class="service-desc">'+desc+'</div></div></div>';
}

init();
})();
</script>
</body>
</html>

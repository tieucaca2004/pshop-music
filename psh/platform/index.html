<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSH Platform</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:#13161c;background:#f5f6f8;display:flex;overflow:hidden;height:100vh}
.sidebar{width:230px;background:#fff;border-right:1px solid #e6e8ec;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar .brand{display:flex;align-items:center;gap:.65rem;padding:.85rem 1rem .75rem;border-bottom:1px solid #e6e8ec;flex-shrink:0}
.sidebar .brand .logo{width:30px;height:30px;background:linear-gradient(135deg,#4F46E5,#8b5cf6);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.7rem;flex-shrink:0}
.sidebar .brand .name{font-weight:700;font-size:.92rem}
.sidebar .brand .tag{font-size:.5rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:#eef2ff;color:#4F46E5;padding:.12rem .35rem;border-radius:3px}
.nav-area{flex:1;overflow-y:auto;padding:.35rem .5rem}
.nav-cat{font-size:.6rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;padding:.4rem .55rem .2rem}
.nav-item{display:flex;align-items:center;gap:.5rem;padding:.38rem .55rem;border-radius:5px;color:#6b7280;font-size:.76rem;font-weight:500;text-decoration:none;transition:all .12s;margin-bottom:1px}
.nav-item:hover{background:#f5f6f8;color:#13161c;border-color:#e6e8ec}
.nav-item.active{background:#eef2ff;color:#4F46E5}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f5f6f8}
.psh-iframe{width:100%;height:100%;border:none;background:#fff}
</style>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<aside class="sidebar">
<div class="brand">
<div class="logo">P</div>
<div><span class="name">PSH Platform</span></div>
<span class="tag">Platform</span>
</div>
<div class="nav-area">
<div class="nav-cat">Workspace</div>
<a class="nav-item active" href="/psh/platform" data-route="/admin/index.html">📊 Dashboard</a>
<div class="nav-cat">Media</div>
<a class="nav-item" href="/psh/platform/media-center" data-route="/media-center">🎬 Media Center</a>
<div class="nav-cat">Content</div>
<a class="nav-item" href="/psh/platform/products" data-route="/admin/products.html">📦 Products</a>
<a class="nav-item" href="/admin/media-library.html">📁 Media</a>
<a class="nav-item" href="/admin/blog.html">📝 Blog</a>
<div class="nav-cat">Intelligence</div>
<a class="nav-item" href="/admin/ai/index.html">🤖 AI</a>
<a class="nav-item" href="/admin/ai/images.html">🎨 AI Images</a>
<div class="nav-cat">System</div>
<a class="nav-item" href="/admin/settings.html">⚙️ Settings</a>
<a class="nav-item" href="/admin/users.html">👥 Users</a>
</div>
</aside>
<main class="main">
<iframe class="psh-iframe" src="/admin/index.html" name="psh-workspace"></iframe>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/js/firebase-config.js?v=41283f6"></script>
<script src="/js/auth-context.js?v=41283f6"></script>
<script>
(function () {
  'use strict';
  // Auth guard — chỉ admin/editor được truy cập PSH Platform
  AuthContext.init().then(function () {
    var user = AuthContext.getCurrentUser();
    var role = AuthContext.getCurrentRole();
    if (!user) { window.location.href = '/admin/login.html'; return; }
    if (role !== 'admin' && role !== 'editor' && role !== 'super_admin') {
      window.location.href = '/admin/login.html?denied=1'; return;
    }
  });

  // Sidebar nav: tải route qua iframe (đổi iframe src theo data-route)
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      var route = el.getAttribute('data-route') || el.getAttribute('href');
      if (!route) return;
      var iframe = document.querySelector('.psh-iframe');
      if (iframe) iframe.src = route;
      document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
      el.classList.add('active');
    });
  });
})();
</script>
</body>
</html>

<script>
// Shared Runtime init
window.__PSH__ = window.__PSH__ || {};
(function initRuntime() {
  // Ensure Firebase initializes only once
  if (window.__PSH__.runtimeReady) return;
  
  // AuthContext auto-inits with firebase.auth().onAuthStateChanged
  // BusinessContext auto-inits similarly
  // WorkspaceEngine loads existing modules
  
  window.__PSH__.runtimeReady = true;
  console.log("[PSH Shared Runtime] initialized");
})();
</script><!-- Compatibility Layer stubs -->
<div id="adminSidebar" style="display:none"><div class="admin-brand">PSH</div></div>
<div id="adminTopbar" style="display:none"></div>
<div class="admin-shell" style="display:none"><div class="admin-main"></div></div>
<!-- Compatibility Layer -->
<script>
(function() {
  // Prevent double init
  if (window.__PSH__ && window.__PSH__.compatReady) return;
  var NS = window.__PSH__ = window.__PSH__ || {};
  
  // Load admin.css
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "/css/admin.css";
  document.head.appendChild(link);
  
  // AdminAuth compatibility: prevent AdminAuth from rendering admin sidebar/topbar
  // when called from within PSH shell. Admin module JS still calls AdminAuth.init()
  // which renders admin UI - we intercept and suppress only the rendering.
  var checkCompat = setInterval(function() {
    if (typeof AdminAuth !== "undefined") {
      clearInterval(checkCompat);
      var origInit = AdminAuth.init;
      var origLogout = AdminAuth.logout;
      
      AdminAuth.init = function(options) {
        return origInit.call(this, options).then(function(result) {
          // PSH suppresses the rendered admin UI
          var sb = document.getElementById("adminSidebar");
          var tb = document.getElementById("adminTopbar");
          if (sb) sb.style.display = "none";
          if (tb) tb.style.display = "none";
          return result;
        });
      };
      
      AdminAuth.logout = function() {
        firebase.auth().signOut().then(function() {
          window.location.href = "/psh-console/auth.html";
        });
      };
    }
  }, 100);
  
  NS.compatReady = true;
  console.log("[PSH Compatibility Layer] ready");
})();
</script>
<script>
(function() {
  if (window.__PSH__ && window.__PSH__.moduleLoaderReady) return;
  var NS = window.__PSH__ = window.__PSH__ || {};
  
  NS.ModuleLoader = {
    _modules: {},
    _cache: {},
    _current: null,
    
    register: function(config) {
      if (!config || !config.name) {
        console.warn("[PSH ModuleLoader] register() requires a config with name");
        return false;
      }
      if (this._modules[config.name]) {
        console.warn("[PSH ModuleLoader] Module "" + config.name + "" already registered");
        return false;
      }
      this._modules[config.name] = {
        name: config.name,
        path: config.path || "/admin/" + config.name + ".html",
        initFn: config.initFn || null,
        singleton: config.singleton !== false,
        _loaded: false
      };
      console.log("[PSH ModuleLoader] Registered: " + config.name);
      return true;
    },
    
    load: function(name) {
      var mod = this._modules[name];
      if (!mod) {
        console.warn("[PSH ModuleLoader] Unknown module: " + name);
        return Promise.reject(new Error("Unknown module: " + name));
      }
      // For now, defer to iframe — do NOT load natively yet
      console.log("[PSH ModuleLoader] load("" + name + "") — deferred to iframe");
      return Promise.resolve({ deferred: true, name: name });
    },
    
    unload: function() {
      if (this._current) {
        console.log("[PSH ModuleLoader] unload: " + this._current);
        this._current = null;
      }
      return true;
    },
    
    isRegistered: function(name) {
      return !!this._modules[name];
    },
    
    list: function() {
      return Object.keys(this._modules);
    }
  };
  
  // Register all 16 known modules
  var MODULE_NAMES = [
    "dashboard", "products", "categories", "blog", "banners", "sliders",
    "media-library", "videos", "ai", "ai-images",
    "settings", "seo", "billing", "users", "menu", "footer"
  ];
  MODULE_NAMES.forEach(function(name) {
    NS.ModuleLoader.register({ name: name });
  });
  
  NS.moduleLoaderReady = true;
  console.log("[PSH ModuleLoader] " + MODULE_NAMES.length + " modules registered");
})();
</script>
<script>
(function() {
  if (window.__PSH__ && window.__PSH__.routerReady) return;
  var NS = window.__PSH__ = window.__PSH__ || {};
  
  NS.Router = {
    _routes: {},
    _history: [],
    _current: null,
    
    registerRoute: function(name, config) {
      if (!name) { console.warn("[PSH Router] registerRoute requires a name"); return false; }
      if (this._routes[name]) { console.warn("[PSH Router] Route "" + name + "" already registered"); return false; }
      this._routes[name] = {
        name: name,
        path: config.path || "/admin/" + name + ".html",
        type: config.type || "iframe",
        title: config.title || name
      };
      return true;
    },
    
    navigate: function(name) {
      var route = this._routes[name];
      if (!route) {
        console.warn("[PSH Router] Unknown route: " + name);
        return false;
      }
      this._history.push(name);
      this._current = name;
      
      // All routes use iframe for now
      var iframe = document.querySelector(".psh-iframe") || document.querySelector("iframe[name=psh-workspace]");
      if (iframe) {
        iframe.src = route.path;
      }
      
      // Update sidebar active state
      document.querySelectorAll(".nav-item").forEach(function(el) {
        el.style.opacity = el.getAttribute("href") === route.path ? "1" : "0.6";
        el.style.fontWeight = el.getAttribute("href") === route.path ? "600" : "400";
      });
      
      return true;
    },
    
    currentRoute: function() {
      return this._current;
    },
    
    back: function() {
      if (this._history.length <= 1) return false;
      this._history.pop();
      var prev = this._history[this._history.length - 1];
      if (prev) this.navigate(prev);
      return true;
    }
  };
  
  // Register all 16 routes
  var ROUTES = {
    "dashboard": "/admin/index.html",
    "products": "/admin/products.html",
    "categories": "/admin/categories.html",
    "blog": "/admin/blog.html",
    "banners": "/admin/banners.html",
    "sliders": "/admin/sliders.html",
    "media-library": "/admin/media-library.html",
    "videos": "/admin/videos.html",
    "ai": "/admin/ai/index.html",
    "ai-images": "/admin/ai/images.html",
    "settings": "/admin/settings.html",
    "seo": "/admin/seo.html",
    "billing": "/admin/billing.html",
    "users": "/admin/users.html",
    "menu": "/admin/menu.html",
    "footer": "/admin/footer.html"
  };
  Object.keys(ROUTES).forEach(function(name) {
    NS.Router.registerRoute(name, { path: ROUTES[name], type: "iframe" });
  });
  
  // Override sidebar nav-item clicks to use Router
  document.addEventListener("click", function(e) {
    var target = e.target.closest(".nav-item");
    if (target && target.getAttribute("href")) {
      e.preventDefault();
      var href = target.getAttribute("href");
      // Find route name from href
      var found = null;
      Object.keys(ROUTES).forEach(function(name) {
        if (ROUTES[name] === href) found = name;
      });
      if (found) {
        NS.Router.navigate(found);
      }
    }
  }, true);
  
  NS.routerReady = true;
  console.log("[PSH Router] " + Object.keys(ROUTES).length + " routes registered");
})();
</script></body>
